<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&family=Quicksand:wght@500;600&family=Bowlby+One&family=Gloock&display=swap" rel="stylesheet" />
    <style>
      :root {
        --blue: #0b4fb3;
        --brown: #6b4300;
        --pink: #ff2d87;
        --green: #9be32a;
        --purple: #b565f0;
        --sky: #43d1f7;
        --line: #b8860b;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Quicksand", sans-serif;
        color: var(--brown);
        overflow-x: hidden;
        background: linear-gradient(180deg, #fbd77f 0%, #fde9b0 45%, #fbd77f 100%);
      }
      /* NAVBAR & FOOTER */
      .bar {
        background: linear-gradient(180deg, #3fd0f7, #b5dcff);
      }
      .bar.navbar {
        min-height: 78px;
        padding: 0.5rem 0;
        overflow: visible;
      }
      .navbar .container,
      .navbar-collapse {
        overflow: visible;
      }
      .navbar-nav {
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .navbar-nav .nav-link {
        font-family: "Comfortaa", sans-serif;
        font-size: clamp(1.05rem, 2.3vw, 1.5rem);
        line-height: 1.5;
        white-space: nowrap;
        color: var(--blue);
        padding: 0.35rem clamp(0.5rem, 1.4vw, 1rem);
      }
      @media (max-width: 767px) {
        .navbar-collapse {
          background: #ffffffb0;
          border-radius: 14px;
          margin-top: 0.5rem;
          padding: 0.4rem;
        }
        .navbar-nav {
          align-items: center;
        }
      }
      .navbar-nav .nav-link:hover {
        color: #ff2d87;
      }
      .navbar-toggler {
        border: 0;
        background: #fff8;
      }
      footer.bar {
        background: linear-gradient(0deg, #3fd0f7, #b5dcff);
        font-family: "Comfortaa", sans-serif;
        color: var(--blue);
        font-size: 1.8rem;
      }
      footer a {
        color: #111;
        font-size: 2.4rem;
        margin-left: 0.9rem;
        text-decoration: none;
      }
      /* SECTION */
      .sec {
        position: relative;
        padding: 4rem 0;
        border-top: 2px solid var(--line);
        background: radial-gradient(ellipse at 50% 40%, #fff6d6 0%, rgba(255, 246, 214, 0) 65%);
      }
      #hero {
        border-top: 0;
        padding: 5rem 0;
        background: radial-gradient(ellipse at 50% 90%, #fff6d6, rgba(255, 246, 214, 0) 70%);
      }
      .sec .container {
        position: relative;
        z-index: 2;
      }
      .stars-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 1;
        pointer-events: none;
      }
      .star {
        position: absolute;
        aspect-ratio: 1;
        background-color: var(--c);
        background-image: radial-gradient(rgba(0, 0, 0, 0.85) 26%, transparent 29%);
        background-size: 9px 9px;
        clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      }
      .spark {
        position: absolute;
        color: #fff;
        text-shadow: 0 0 12px #fff;
        z-index: 1;
      }
      /* JUDUL STIKER (teks cadangan kalau gambar belum ada) */
      .ttl {
        display: inline-block;
        line-height: 1;
        transform: rotate(-3deg);
        -webkit-text-stroke: 2px #000;
        paint-order: stroke fill;
        font-family: "Gloock", serif;
        font-size: clamp(2.6rem, 9vw, 5.5rem);
        letter-spacing: -0.04em;
        margin: 0;
      }
      .ttl img {
        max-width: 100%;
        height: auto;
      }
      .oval {
        background: #fffff0;
        border: 2px solid #111;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      /* HERO */
      .hero-oval {
        width: min(100%, 900px);
        aspect-ratio: 2.1/1;
        margin: 0 auto;
      }
      .hero-oval .ttl {
        font-size: clamp(2.6rem, 11vw, 7.5rem);
        -webkit-text-stroke: 0;
        transform: rotate(-3deg);
        font-family: "Gloock", serif;
        letter-spacing: -0.06em;
        white-space: nowrap;
      }
      .hero-oval .ttl span {
        display: inline-block;
        background: linear-gradient(180deg, #ff6fb0 0%, #ff1f80 55%, #d10d68 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        transform-origin: center bottom;
      }
      /* ABOUT */
      .polaroid {
        background: #fff;
        padding: 0.9rem 0.9rem 2.6rem;
        width: min(78%, 330px);
        margin: 0 auto;
        transform: rotate(-8deg);
        box-shadow: 0 6px 14px #0003;
        position: relative;
        background-image: radial-gradient(#fde9a0 22%, transparent 24%);
        background-size: 70px 70px;
      }
      .polaroid img {
        width: 100%;
        aspect-ratio: 4/5;
        object-fit: cover;
        display: block;
        border: 2px solid #222;
      }
      .polaroid .nm {
        position: absolute;
        bottom: 0.5rem;
        left: 0;
        right: 0;
        text-align: center;
        font-weight: 700;
        font-size: 1.5rem;
        transform: rotate(4deg);
        font-family: "Quicksand", sans-serif;
        color: #4a2c00;
      }
      .box {
        background: #fff;
        border: 1.5px solid #333;
        border-radius: 6px;
        padding: 1rem 1.2rem;
      }
      .about-box {
        min-height: 300px;
        white-space: pre-line;
      }
      .about-ttl .ttl {
        color: var(--green);
      }
      .about-ttl .oval {
        padding: 0.2rem 1.6rem;
        margin-left: -1.2rem;
        vertical-align: bottom;
      }
      /* PROJECT */
      .pill {
        font-family: "Gloock", serif;
        color: var(--purple);
        background: #fffff0;
        border: 1.5px solid #333;
        border-radius: 50px;
        padding: 0.1rem 1.4rem;
        font-size: 1.5rem;
        cursor: pointer;
        margin: 0.2rem;
      }
      .pill.active {
        background: var(--purple);
        color: #fff;
      }
      .proj-ttl .ttl {
        color: var(--purple);
        -webkit-text-stroke: 2px #fff;
      }
      .pcard {
        color: inherit;
        text-decoration: none;
        display: block;
      }
      .pcard .thumb {
        background: #fff;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        width: 100%;
      }
      .pcard .thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      /* mode foto: contain = utuh di kotak, cover = dipotong, auto = kotak mengikuti tinggi foto */
      .fit-cover .thumb img {
        object-fit: cover;
      }
      .fit-auto .thumb {
        aspect-ratio: auto !important;
        background: transparent;
        overflow: visible;
        border-radius: 0;
      }
      .fit-auto .thumb img {
        width: 100%;
        height: auto;
        max-height: 80vh;
        object-fit: contain;
        border-radius: 6px;
        box-shadow: 0 6px 14px #0002;
      }
      .pcard p {
        margin: 0.6rem 0 0;
      }
      /* ukuran sama persis desain asli (366x171 dan 468x327) */
      .pcard.small .thumb {
        aspect-ratio: 366/171;
      }
      .pcard.big .thumb {
        aspect-ratio: 468/327;
      }
      .pcard.small p {
        text-align: center;
      }
      .pcard.big {
        display: flex;
        align-items: center;
        gap: 3%;
      }
      .pcard.big .thumb {
        flex: 0 0 74.5%;
      }
      .pcard.big p {
        margin: 0;
      }
      /* posisi: kecil di kiri, besar + deskripsi di kanan */
      .prow {
        display: grid;
        grid-template-columns: 8fr 31fr 8fr 53fr;
        align-items: center;
        margin-bottom: 2.5rem;
      }
      .c-s {
        grid-column: 2;
      }
      .c-b {
        grid-column: 4;
      }
      @media (max-width: 767px) {
        .prow {
          grid-template-columns: 1fr;
          gap: 1.5rem;
        }
        .c-s,
        .c-b {
          grid-column: 1;
        }
        .pcard.big {
          display: block;
        }
        .pcard.big .thumb {
          width: 100%;
        }
        .pcard.big p {
          text-align: center;
          margin-top: 0.6rem;
        }
      }
      /* CONTACT */
      .c-ttl .oval {
        width: 100%;
        padding: 1rem;
      }
      .c-ttl .ttl {
        color: #7fdcff;
        -webkit-text-stroke: 2px #1a6fb0;
      }
      .note {
        margin-top: 1rem;
        font-family: "Gloock", serif;
        color: #8fb0ff;
        font-size: 1.5rem;
        line-height: 1.1;
      }
      .cform {
        padding: 1.5rem;
      }
      .cform label {
        display: block;
        font-size: 1.25rem;
        font-weight: 600;
        color: #5b4300;
        margin: 0 0 0.15rem 0.2rem;
      }
      .cform input,
      .cform textarea {
        width: 100%;
        border: 2px solid #c9a24d;
        border-radius: 10px;
        outline: 0;
        background: #fffdf5;
        font-size: 1.1rem;
        color: #5b4300;
        padding: 0.55rem 0.9rem;
        margin-bottom: 1rem;
        font-family: "Quicksand", sans-serif;
        transition: 0.2s;
      }
      .cform input:focus,
      .cform textarea:focus {
        border-color: var(--pink);
        box-shadow: 0 0 0 0.2rem #ff2d8730;
        background: #fff;
      }
      .cform input::placeholder,
      .cform textarea::placeholder {
        color: #c4b48a;
      }
      .cform textarea {
        resize: none;
      }
      .cform button {
        border: 0;
        background: var(--pink);
        color: #fff;
        border-radius: 50px;
        padding: 0.3rem 1.6rem;
        font-weight: 700;
        float: right;
      }
      @media (max-width: 575px) {
        .pill {
          font-size: 1.2rem;
        }
      }

      /* ================= ANIMASI ================= */
      @keyframes floaty {
        0%,
        100% {
          transform: rotate(var(--r)) translateY(0);
        }
        50% {
          transform: rotate(calc(var(--r) + 10deg)) translateY(-16px);
        }
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.15;
          scale: 0.5;
          rotate: 0deg;
        }
        50% {
          opacity: 1;
          scale: 1.2;
          rotate: 45deg;
        }
      }
      @keyframes wave {
        0%,
        100% {
          translate: 0 0;
        }
        50% {
          translate: 0 -12px;
        }
      }
      @keyframes pop {
        from {
          scale: 0.4;
          opacity: 0;
        }
        to {
          scale: 1;
          opacity: 1;
        }
      }
      @keyframes drop {
        from {
          translate: 0 -100%;
          opacity: 0;
        }
        to {
          translate: 0 0;
          opacity: 1;
        }
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 #ff2d8760;
        }
        50% {
          box-shadow: 0 0 0 10px #ff2d8700;
        }
      }
      @keyframes wiggle {
        0%,
        100% {
          rotate: 0deg;
        }
        25% {
          rotate: -4deg;
        }
        75% {
          rotate: 4deg;
        }
      }
      @keyframes shine {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 200% 50%;
        }
      }
      .star {
        transform: rotate(var(--r, 0deg));
        animation: floaty var(--d, 6s) ease-in-out infinite;
      }
      .spark {
        animation: twinkle 2.6s ease-in-out infinite;
      }
      .navbar {
        animation: drop 0.7s ease both;
      }
      .navbar-nav .nav-link {
        transition:
          transform 0.25s,
          color 0.25s;
      }
      .navbar-nav .nav-link:hover {
        transform: translateY(-4px) scale(1.1);
      }
      .hero-oval {
        animation: pop 1s cubic-bezier(0.2, 1.5, 0.4, 1) both;
      }
      .hero-oval .ttl span {
        animation: wave 2.2s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.12s);
      }
      .hero-oval .ttl span {
        background-size: 100% 200%;
      }
      .reveal {
        opacity: 0;
        translate: 0 45px;
        transition:
          opacity 0.8s ease,
          translate 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      .reveal.in {
        opacity: 1;
        translate: 0 0;
      }
      .ttl {
        transition: transform 0.3s;
      }
      .ttl:hover {
        animation: wiggle 0.5s ease 2;
      }
      .polaroid {
        transition:
          transform 0.4s cubic-bezier(0.2, 1.4, 0.4, 1),
          box-shadow 0.4s,
          opacity 0.8s ease,
          translate 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      .polaroid:hover {
        transform: rotate(-2deg) scale(1.05);
        box-shadow: 0 14px 28px #0004;
      }
      .pcard .thumb {
        transition:
          transform 0.35s cubic-bezier(0.2, 1.4, 0.4, 1),
          box-shadow 0.35s;
      }
      .pcard:hover .thumb {
        transform: scale(1.04) rotate(-1.2deg);
        box-shadow: 0 12px 24px #0003;
      }
      .pill {
        transition:
          transform 0.25s,
          background 0.25s,
          color 0.25s;
      }
      .pill:hover {
        transform: translateY(-3px) scale(1.08) rotate(-2deg);
      }
      .cform button {
        animation: pulse 2s infinite;
        transition: transform 0.25s;
      }
      .cform button:hover {
        transform: scale(1.1) rotate(-2deg);
      }
      footer a {
        display: inline-block;
        transition: transform 0.3s;
      }
      footer a:hover {
        transform: scale(1.25) rotate(-10deg);
        color: #ff2d87;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        .reveal {
          opacity: 1;
          translate: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-md bar sticky-top">
      <div class="container">
        <button class="navbar-toggler ms-auto" data-bs-toggle="collapse" data-bs-target="#nv"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse justify-content-end" id="nv">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#hero">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="#project">project</a></li>

      <div class="container text-center">
        <div class="oval hero-oval"><h1 class="ttl" data-title="portfolio">PORTFOLIO</h1></div>
      </div>
    </section>

    <!-- ABOUT -->
    <section class="sec" id="about">

    <section class="sec" id="project">

      <div class="container">
        <div class="row align-items-center mb-4 g-3">
          <div class="col-lg-6 order-lg-1 order-2" id="filters"></div>

        </div>
        <div id="projects"></div>
      </div>

      <div class="container">
        <div class="row g-4 align-items-start">

              <label for="fm">massage</label><textarea id="fm" name="message" rows="4" placeholder="tulis pesan di sini..." required></textarea> <button type="submit">Kirim</button>
              <div class="clearfix"></div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="bar py-3">
      <div class="container d-flex justify-content-between align-items-center"><span id="copy"></span><span id="socials"></span></div>
    </footer>

          {
            title: "Blueberry cake",
            desc: ` Ilustrasi digital bertema blueberry cake yang mengeksplorasi perpaduan warna, detail dekoratif, dan bentuk untuk menghadirkan visual dessert yang menarik. Karya ini berfokus pada pengembangan kreativitas melalui pengolahan
              elemen visual menjadi ilustrasi yang memiliki karakter dan daya tarik tersendiri.`,
            category: "digital art",
            image: "img/4.jpeg",
            link: "",
          },
        ],
        /* Judul bergaya stiker: isi dengan file PNG transparan agar 100% mirip desain.
     Kosong = pakai teks biasa sebagai cadangan. */
        titles: { portfolio: "", about: "", aboutMe: "", project: "", contact: "" },
        /* Bintang dekorasi: [kiri%, atas%, ukuran px, warna] */
        stars: [
          [2, 12, 90, "#f58ad8"],
          [18, 2, 70, "#c5f56a"],
          [80, 5, 80, "#c5f56a"],
          [90, 35, 110, "#f58ad8"],
          [6, 68, 110, "#7ff5e0"],
          [48, 75, 80, "#7ff5e0"],
          [70, 60, 40, "#ffe94d"],
          [30, 50, 38, "#b995f5"],
        ],
      };
      /* ===================== AKHIR BAGIAN EDIT ===================== */

      const $ = (s) => document.querySelector(s);
      const ph =
        "data:image/svg+xml;utf8," +
        encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500"><rect width="100%" height="100%" fill="#ddd"/><text x="50%" y="50%" text-anchor="middle" fill="#888" font-size="28">foto</text></svg>');

      $("#photo").src = CONFIG.photo || ph;
      $("#nameTag").textContent = CONFIG.name;
      $("#aboutText").textContent = CONFIG.about;
      $("#note").textContent = CONFIG.note;
      $("#copy").textContent = "© " + CONFIG.name;

      // judul gambar
      document.querySelectorAll("[data-title]").forEach((el) => {
        const src = CONFIG.titles[el.dataset.title];
        if (src) el.innerHTML = `<img src="${src}" alt="${el.textContent}" style="max-height:${el.dataset.title === "portfolio" ? "70%" : "120px"}">`;
        if (src) el.style.cssText += ";-webkit-text-stroke:0;transform:none";
      });

      // judul hero: huruf berukuran & miring berbeda-beda seperti desain asli
      const hero = document.querySelector('[data-title="portfolio"]');
      if (!CONFIG.titles.portfolio) {
        const rot = [-6, 8, -4, 7, -9, 5, -3, 9, -6],
          sc = [1.25, 1.1, 1.3, 1.05, 1.35, 1.15, 1.3, 1.1, 1.4],
          fs = [1, 1.15, 0.95, 1.1, 1, 1.15, 0.9, 1.1, 1.15];
        hero.innerHTML = [...hero.textContent].map((ch, i) => `<span style="--i:${i};transform:rotate(${rot[i % 9]}deg) scaleY(${sc[i % 9]});font-size:${fs[i % 9]}em">${ch}</span>`).join("");
      }

      // socials (Bootstrap Icons)
      document.head.insertAdjacentHTML("beforeend", '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">');
      $("#socials").innerHTML = CONFIG.socials.map((s) => `<a href="${s.url}" target="_blank"><i class="bi ${s.icon}"></i></a>`).join("");

      // bintang
      document.querySelectorAll(".stars-layer").forEach((layer, i) => {
        CONFIG.stars.forEach((s, k) => {
          const d = document.createElement("div");
          d.className = "star";
          const flip = (i + k) % 2 ? 1 : -1;
          d.style.cssText = `left:${(s[0] + i * 13) % 96}%;top:${(s[1] + i * 17 + k * 3) % 90}%;width:${s[2]}px;--c:${s[3]};--r:${flip * (8 + k * 7)}deg;--d:${5 + (k % 4) * 1.5}s;animation-delay:-${k * 0.9}s`;
          layer.appendChild(d);
        });
      });

      // kilauan ✦
      document.querySelectorAll(".stars-layer").forEach((layer, i) => {
        [
          [12, 22, 30],
          [86, 14, 38],
          [72, 78, 26],
          [24, 86, 34],
          [52, 8, 24],
          [94, 60, 28],
        ].forEach((p, k) => {
          const sp = document.createElement("span");
          sp.className = "spark";
          sp.textContent = "✦";
          sp.style.cssText = `left:${(p[0] + i * 7) % 95}%;top:${(p[1] + i * 9) % 90}%;font-size:${p[2]}px;animation-delay:${(k * 0.5 + i * 0.3) % 3}s`;
          layer.appendChild(sp);
        });
      });

      // animasi muncul saat di-scroll
      document.querySelectorAll(".polaroid,.about-ttl,.about-box,.proj-ttl,#filters,.c-ttl,.cform").forEach((el) => el.classList.add("reveal"));
      const io =
        "IntersectionObserver" in window
          ? new IntersectionObserver(
              (es) =>
                es.forEach((e) => {
                  if (e.isIntersecting) {
                    e.target.classList.add("in");
                    io.unobserve(e.target);
                  }
                }),
              { threshold: 0.15 },
            )
          : null;
      function observeReveal() {
        document.querySelectorAll(".reveal:not(.in)").forEach((el, i) => {
          el.style.transitionDelay = (el.classList.contains("pcard") ? (i % 2) * 0.15 : 0) + "s";
          io ? io.observe(el) : el.classList.add("in");
        });
      }

      // project + filter
      function card(p, type) {
        return `<a class="pcard ${type} fit-${CONFIG.imageFit || "auto"} reveal" ${p.link ? `href="${p.link}" target="_blank"` : ""}>
    <div class="thumb">${p.image ? `<img src="${p.image}" alt="${p.title}">` : p.title}</div><p>${p.desc}</p></a>`;
      }
      function renderProjects(cat) {
        const list = CONFIG.projects.filter((p) => cat === "ALL" || p.category === cat);
        let html = "";
        for (let i = 0; i < list.length; i += 2) {
          html += `<div class="prow"><div class="c-s">${card(list[i], "small")}</div>` + (list[i + 1] ? `<div class="c-b">${card(list[i + 1], "big")}</div>` : "") + `</div>`;
        }
        $("#projects").innerHTML = html;
        observeReveal();
      }
      $("#filters").innerHTML = CONFIG.categories.map((c, i) => `<button class="pill ${i ? "" : "active"}" data-c="${c}">${c}</button>`).join("");
      $("#filters").addEventListener("click", (e) => {
        const b = e.target.closest(".pill");
        if (!b) return;
        document.querySelectorAll(".pill").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        renderProjects(b.dataset.c);
      });
      renderProjects("ALL");
      observeReveal();

      // form contact -> Google Spreadsheet (kalau sheetUrl diisi), kalau kosong buka aplikasi email
      $("#cform").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.target,
          f = new FormData(form),
          btn = form.querySelector("button");
        if (!CONFIG.sheetUrl) {
          location.href = `mailto:${CONFIG.email}?subject=${encodeURIComponent("Pesan dari " + f.get("name"))}&body=${encodeURIComponent(f.get("message") + "\n\n" + f.get("email"))}`;
          return;
        }
        const old = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Mengirim...";
        try {
          await fetch(CONFIG.sheetUrl, { method: "POST", mode: "no-cors", body: new URLSearchParams(f) });
          btn.textContent = "Terkirim ✓";
          form.reset();
        } catch (err) {
          btn.textContent = "Gagal, coba lagi";
        }
        setTimeout(() => {
          btn.textContent = old;
          btn.disabled = false;
        }, 2500);
      });
    </script>
  </body>
</html>
